name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Godot resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android Debug" build/android/juego.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: videojuego-android-apk
          path: build/android/juego.apk
          if-no-files-found: error
          retention-days: 14
